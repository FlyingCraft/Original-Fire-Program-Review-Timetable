<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="9月25日至27日节目审核可到场时间统计">
  <title>节目审核时间统计</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body data-page="form">
  <header class="topbar"><span class="logo">✓</span><div><small>PROGRAM REVIEW</small><h1>节目审核时间统计</h1></div></header>
  <main class="shell">
    <section id="success" class="notice hidden"><b>✓</b><div><strong>时间已保存</strong><p>负责人会根据整体情况另行通知审核安排。</p></div><button id="edit-again">继续修改</button></section>
    <section class="intro"><div class="date"><span>SEP</span><strong>25—27</strong><em>2026</em></div><div><h2>勾选所有能够到场的时间</h2><p>可切换 30 分钟或 1 小时选择。输入相同的社内 ID 与修改码即可跨设备更新原记录。</p></div></section>
    <section class="card">
      <div class="heading"><b>01</b><h2>你的信息</h2><small>仅通过 ID 与修改码识别</small></div>
      <div class="fields"><label>社内 ID <i>*</i><input id="name" maxlength="30" placeholder="请输入社内 ID" autocomplete="username" spellcheck="false"></label><label>修改码 <i>*</i><input id="group" type="password" minlength="4" maxlength="50" placeholder="至少 4 位，请妥善保存" autocomplete="current-password"></label></div>
      <div class="heading"><b>02</b><h2>可到场时段</h2><div class="heading-actions"><small id="selected-count">已选 0 小时，可在右侧切换选择时段长度</small><div id="form-granularity" class="view-switch" aria-label="时间粒度"><button class="active" data-minutes="30">30 分钟</button><button data-minutes="60">1 小时</button></div></div></div>
      <div class="table-scroll"><div id="picker" class="time-grid"></div></div>
      <label class="note">补充说明<textarea id="note" maxlength="200" placeholder="例如：19:30 后才能到、需要提前离场……"></textarea></label>
      <div class="submit"><p>请尽量多选，方便安排共同时间</p><button id="submit">提交 / 更新可用时间</button></div>
    </section>
  </main>
  <div id="toast" class="toast hidden"></div>
  <script src="./assets/app.js?v=9"></script>
</body>
</html>
